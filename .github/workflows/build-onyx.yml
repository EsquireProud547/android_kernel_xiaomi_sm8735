name: Build Onyx Kernel

# Builds a Capybara-tuned Xiaomi SM8735 (onyx) GKI kernel and packages it as a
# flashable AnyKernel3 zip.
#
# Migrated from kernel_xiaomi_sm8735 (which holds android15-6.6 @ 6.6.82) to
# this tree, which is branch `seventeen` @ 6.6.142. The pipeline design is
# unchanged; what follows is the list of things that genuinely differ.
#
# Carried over from gki-clo's build-capybara.yml and from the 6.6.82 pipeline:
# runner/swap/cleanup, dependency list, Clang fetch+cache, three-tier ccache
# keys, ReSukiSU, SUSFS + fixup, Droidspaces kABI patch, the build command,
# AnyKernel3 packaging and artifact upload. Also unchanged: config synthesis
# follows the STOCK Kleaf mixed-build (build.config.msm.perf +
# build.config.msm.common) rather than a hand-baked defconfig, with the same
# three gates, so a fragment that does not take effect fails the build instead
# of silently disabling a feature.
#
# What had to change for 6.6.142, and why:
#
#   * Both patches were regenerated for this tree, because the code they touch
#     is identical but the line numbers moved:
#       - droidspaces_sysvipc.patch   sched.h hunks +1 / +6 lines
#       - libbpf_strchr_const.patch   libbpf.c +14 lines, Makefile:89 -> :88
#     Both verified to apply with `patch -p1` at ZERO offset and ZERO fuzz.
#
#   * A third patch, extract_cert_pkcs11_engine.patch, fixes an upstream
#     regression in 6.6.142 rather than a porting difference. Upstream
#     64282a745897 wrapped key_pass's declaration in '#ifdef USE_PKCS11_ENGINE'
#     but left its only use behind '#ifdef OPENSSL_IS_BORINGSSL'. Nothing in
#     kbuild defines USE_PKCS11_ENGINE, so certs/extract-cert.c -- a host tool,
#     built because CONFIG_MODULE_SIG_KEY is set -- cannot compile at all
#     against a stock OpenSSL. That commit is present in 6.6.142 and absent in
#     6.6.82, which is why the other tree builds and this one did not. The
#     step below compiles the tool immediately after patching it, so a future
#     upstream fix or a new break shows up in seconds instead of 1500 objects
#     into the build.
#
#   * SUSFS still comes from susfs4ksu's `gki-android15-6.6` branch. There is no
#     android17-6.6 branch, but that patch does apply to 6.6.142 (19 hunks, 0
#     failures, 1 hunk at fuzz 1), so the branch is now pinned to a commit and
#     the result is recorded in SUSFS_STATUS rather than assumed.
#
#   * AutoFDO now uses the profile that ships IN THIS TREE
#     (android/gki/aarch64/afdo/kernel.afdo, collected on 6.6.129) instead of
#     downloading one. The old pipeline pulled the android15-6.6 profile from
#     android.googlesource.com, which is a much larger version gap, and is the
#     only GKI profile still published there.
#
#   * Module signing is SHA-256 here, not SHA-512. This is not a choice made in
#     this file: 6.6.142's gki_defconfig sets CONFIG_MODULE_SIG_SHA256=y
#     explicitly, overriding the Kconfig default of MODULE_SIG_SHA512. The
#     6.6.82 tree set no choice at all and therefore got SHA-512. Both are
#     stock base behaviour; do not "fix" it in a fragment, that is a gate 1
#     override.
#
#   * .gitignore had TWO rules that swallow the CI directory -- line 13 `.*`
#     (matches .github/ itself) and line 40 `*.patch` (matches
#     .github/actions/*.patch). Both are negated at the bottom of that file.
#     Missing either one is silent: `git add -A` skips the files, `git status`
#     stays clean, the workflow still lands in the repo, and CI dies a few steps
#     in with "No such file or directory" for a file that looks like it is
#     right there in the commit. That is how the first run failed.
#
# Not ported: BBRv3, NTSYNC, Baseband-guard (absent from 6.6.142).

env:
  CLANG_VERSION: clang-r596125
  CLANG_BRANCH: android17-release
  VENDOR_FRAGMENT: arch/arm64/configs/vendor/onyx_perf.config
  KERNEL_CODENAME: Onyx
  # susfs4ksu has no android17-6.6 branch; gki-android15-6.6 is its only 6.6
  # branch, and it does apply to this tree. Deliberately NOT pinned to a
  # commit: we always track the branch head so bug fixes upstream land without
  # a commit here. The cost of that choice is that an upstream change could
  # stop applying to 6.6.142 -- so the outcome is recorded in SUSFS_STATUS and
  # gate 3 turns a lost CONFIG_KSU_SUSFS into a hard build failure. Loud, not
  # silent, which is what matters.
  SUSFS_BRANCH: gki-android15-6.6

on:
  workflow_dispatch:
    inputs:
      enable_susfs:
        description: "Enable SUSFS (hide root traces)"
        type: boolean
        default: true
      ksu_branch:
        description: "ReSukiSU branch (leave empty = main)"
        type: string
        default: "main"
      version:
        description: "Custom version name (optional)"
        type: string
        default: ""
      enable_vendor_modules:
        description: "Merge the built-in (=y) entries of vendor/onyx_perf.config"
        type: boolean
        default: true
      enable_autofdo:
        description: "Use the in-tree GKI AutoFDO profile (non-fatal if unavailable)"
        type: boolean
        default: true
      enable_thinlto:
        description: "ThinLTO. OFF matches the stock device kernel (LTO_NONE) — try this first if a build hangs at boot"
        type: boolean
        default: true
      enable_btf:
        description: "BTF for eBPF/CO-RE (needs pahole >= 1.21; auto-disabled if missing)"
        type: boolean
        default: true
      reduce_debug:
        description: "Trim debug features (ABI-safe; applied to the merged defconfig)"
        type: boolean
        default: true
      reduce_debug_group:
        description: "Which part of the reduction, when reduce_debug is on"
        type: choice
        default: all
        options:
          - all
          - ubsan
          - boot-debug
          - printk
          - rcu-bt
      bundle_modules:
        description: "Also put built .ko files into the zip under modules/ (not flashed)"
        type: boolean
        default: false

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  # This is a pure build: checkout, cache, ccache, compile, upload an artifact.
  # Nothing here writes to the repository, and all four actions work with read
  # only access. The build pipes a third-party script straight into bash
  # (`curl ... ReSukiSU/main/kernel/setup.sh | bash -s`) and clones a moving
  # branch (susfs4ksu gki-android15-6.6). A poisoned dependency should not be
  # able to push to this repo.
  contents: read

jobs:
  build:
    name: onyx-${{ inputs.enable_susfs == true && 'susfs' || 'clean' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v7
        with:
          # This repo's only branch is `seventeen` (origin/HEAD ->
          # refs/heads/seventeen). The 6.6.82 tree used `oss`; do not copy that
          # over.
          ref: seventeen
          fetch-depth: 0

      - name: Fast cleanup + swap
        run: |
          # Aggressive disk cleanup (make room for kernel src + 20GB swap)
          sudo rm -rf \
            /usr/share/dotnet /usr/local/share/powershell \
            /opt/hostedtoolcache/go /usr/local/lib/android \
            /usr/share/swift /usr/local/share/boost 2>/dev/null || true
          sudo apt-get remove -y -qq 2>/dev/null \
            dotnet* aspnetcore* netstandard* mono* ^llvm-.* ^lld-.*  || true
          sudo apt-get autoremove -y -qq 2>/dev/null || true
          df -h /

          # Always recreate swap: runner images may already ship an active one
          # and a bare `if` check misses that (see gki-clo 18e63ee0098f).
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo dd if=/dev/zero of=/swapfile bs=1M count=20480 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ccache flex bison libncurses-dev libssl-dev libelf-dev \
            cpio wget curl jq git zip unzip bc \
            gcc g++ make device-tree-compiler python3

      - name: Install pahole for BTF
        if: inputs.enable_btf
        run: |
          # CONFIG_DEBUG_INFO_BTF needs pahole to turn DWARF into BTF, and the
          # kernel Kconfig demands >= 1.21 because we build DWARF5
          # (lib/Kconfig.debug:380: depends on !DEBUG_INFO_DWARF5 ||
          # PAHOLE_VERSION >= 121). 1.23+ also gives PAHOLE_HAS_BTF_TAG, which
          # bpftool needs for precise fentry/fexit CO-RE targets.
          sudo apt-get install -y -qq dwarves
          ver=$(pahole --version)
          echo "pahole: $ver"
          maj=$(echo "$ver" | sed -E 's/v([0-9]+)\.([0-9]+).*/\1\2/')
          if [ "${maj:-0}" -lt 121 ]; then
            # Non-fatal: degrade to a no-BTF build rather than failing outright.
            echo "::warning::pahole $ver is older than v1.21 (DWARF5 minimum) — BTF disabled"
            echo "BTF_UNAVAILABLE=1" >> $GITHUB_ENV
          elif [ "$maj" -ge 123 ]; then
            echo "  BTF_TAG supported (>= 1.23)"
          fi

      - name: Patch libbpf for modern host compilers
        if: inputs.enable_btf
        run: |
          # CONFIG_DEBUG_INFO_BTF pulls in tools/bpf/resolve_btfids, which links
          # tools/lib/bpf. That code fails to build with a current host compiler
          # (strchr is const-correct in C23) and tools/lib/bpf/Makefile:88 uses
          # `override CFLAGS += -Werror`, so it is fatal. One-line cast fixes it.
          if grep -q 'next_path = (char \*)strchr' tools/lib/bpf/libbpf.c; then
            echo "already patched"
          else
            patch -p1 --forward < .github/actions/libbpf_strchr_const.patch
          fi

      - name: Patch extract-cert for stock OpenSSL
        run: |
          # certs/extract-cert.c is a HOST tool, built because gki_defconfig sets
          # CONFIG_MODULE_SIG_KEY="certs/signing_key.pem". It does not compile
          # at 6.6.142:
          #
          #   certs/extract-cert.c:152:7: error: use of undeclared identifier 'key_pass'
          #
          # Upstream commit 64282a745897 wrapped key_pass's declaration in
          # '#ifdef USE_PKCS11_ENGINE' to silence -Wunused-but-set-global,
          # reasoning that key_pass "is only used with the OpenSSL engine API".
          # The use, however, sits in a branch guarded only by
          # '#ifdef OPENSSL_IS_BORINGSSL'. Nothing in the kbuild system defines
          # USE_PKCS11_ENGINE, so with a stock (non-BoringSSL) host OpenSSL the
          # declaration is compiled out while its only use is compiled in.
          #
          # Not gated on enable_btf: this is the module signing path, not BPF.
          # Not allowed to fail silently either -- without it the build dies in
          # certs/ ~1500 objects in.
          if grep -q 'PKCS#11 extraction requires USE_PKCS11_ENGINE' certs/extract-cert.c; then
            echo "already patched (upstream may have fixed it)"
          else
            patch -p1 --forward < .github/actions/extract_cert_pkcs11_engine.patch
          fi
          # Prove the tool actually builds here, with the host OpenSSL this
          # runner has, instead of finding out 1500 objects into the build.
          if gcc -o /dev/null certs/extract-cert.c -lcrypto 2>/tmp/extract-cert.err; then
            echo "  extract-cert.c compiles against the host OpenSSL"
          else
            echo "::error::extract-cert.c still does not compile:"
            cat /tmp/extract-cert.err
            exit 1
          fi

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v6
        with:
          path: clang-${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}-${{ runner.os }}

      - name: Download Clang toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang-${{ env.CLANG_VERSION }}
          curl -fLSs \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/${{ env.CLANG_VERSION }}.tar.gz" \
            | tar -xz -C clang-${{ env.CLANG_VERSION }}/

      - name: Setup Clang
        run: |
          chmod +x clang-${{ env.CLANG_VERSION }}/bin/clang
          echo "$PWD/clang-${{ env.CLANG_VERSION }}/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$PWD/clang-${{ env.CLANG_VERSION }}/bin" >> $GITHUB_ENV
          CLANG_BIN="$PWD/clang-${{ env.CLANG_VERSION }}/bin/clang"
          CLANG_RAW=$("$CLANG_BIN" --version)
          echo "$CLANG_RAW" | head -2 | sed 's/^/  /'
          # AutoFDO needs a modern clang and says so in Kconfig
          # (arch/Kconfig:804: AUTOFDO_CLANG depends on CC_IS_CLANG &&
          # CLANG_VERSION >= 170000). If the toolchain is too old, olddefconfig
          # drops CONFIG_AUTOFDO_CLANG with no warning, so the loss would only
          # surface as a mysterious gate 3 failure much later. Check it here
          # instead, where the message can name the cause.
          #
          # The version is parsed out of --version, NOT queried with
          # `-print-version-number`. No clang supports that flag -- it is a
          # GCC-ism, and clang answers "error: unknown argument" and exits 1.
          # That line killed the first run of this pipeline at this step.
          # Reproduced locally against /usr/bin/clang 23.1.1 as well, so this
          # is a general clang limitation, not something about the Android
          # build. `-dumpversion` would also work but prints only the number,
          # which reads badly in a log that should show the whole banner.
          CLANG_MAJOR=$(echo "$CLANG_RAW" | sed -nE 's/.*clang version ([0-9]+)\..*/\1/p' | head -1)
          if [ -z "$CLANG_MAJOR" ]; then
            echo "::error::could not parse a clang version out of: $CLANG_RAW"
            exit 1
          fi
          echo "CLANG_MAJOR=$CLANG_MAJOR"
          # Must go to GITHUB_ENV, not just stdout: the Build summary step
          # renders ${{ env.CLANG_MAJOR }}, and a plain echo leaves it empty
          # there -- the job still succeeds, the table just reads "LLVM )".
          echo "CLANG_MAJOR=$CLANG_MAJOR" >> $GITHUB_ENV
          if [ "$CLANG_MAJOR" -lt 17 ]; then
            echo "::error::clang $CLANG_MAJOR is too old -- CONFIG_AUTOFDO_CLANG needs >= 17"
            exit 1
          fi
          echo "CLANG_STATUS=ok (major $CLANG_MAJOR)" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: onyx-614-clang-${{ env.CLANG_VERSION }}-${{ github.ref_name }}
          restore-keys: |
            onyx-614-clang-${{ env.CLANG_VERSION }}-${{ github.ref_name }}
            onyx-614-clang-${{ env.CLANG_VERSION }}-
          max-size: 3G

      - name: Apply ReSukiSU
        run: |
          KSU_BRANCH="${{ inputs.ksu_branch != '' && inputs.ksu_branch || 'main' }}"
          echo "Applying ReSukiSU (branch: $KSU_BRANCH)..."
          if curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
               | bash -s -- "$KSU_BRANCH"; then
            echo "KSU_STATUS=applied ($KSU_BRANCH)" >> $GITHUB_ENV
          else
            echo "KSU_STATUS=FAILED ($KSU_BRANCH)" >> $GITHUB_ENV
            echo "::warning::ReSukiSU integration failed, continuing without it"
          fi

      - name: Apply SUSFS patches
        if: inputs.enable_susfs
        run: |
          echo "Applying SUSFS patches..."
          # Always the branch head -- no pin. susfs4ksu has no android17-6.6
          # branch, so gki-android15-6.6 is its only 6.6 one, and it does apply
          # to this tree. Upstream fixes should arrive without editing this
          # file, so tracking the head is the intended behaviour.
          #
          # Total failure is caught twice: patch's exit status, then gate 3,
          # which fails on a missing CONFIG_KSU_SUSFS. What those do NOT catch
          # is a hunk that applied in the wrong place -- `patch --forward`
          # exits 0 when it relocates a hunk by an offset, and the fuzz hunk
          # lands in fs/proc/task_mmu.c:show_map_vma(), the function that
          # spoofs file identity in /proc/pid/maps. So after applying, assert
          # that function really contains the hooks, in the right order.
          # Measured at the time of writing: 19 hunks apply at offsets
          # (largest +148 in task_mmu.c) and exactly one at fuzz 1.
          if git clone -q https://gitlab.com/simonpunk/susfs4ksu.git \
               -b "${{ env.SUSFS_BRANCH }}" --depth 1 susfs4ksu; then
            echo "  susfs4ksu ${{ env.SUSFS_BRANCH }} @ $(git -C susfs4ksu rev-parse HEAD)"
            echo "  BakaSU/KernelSU @ $(git -C KernelSU rev-parse HEAD 2>/dev/null || echo 'not integrated')"
            # <linux/dma-buf.h> is already in fs/proc/base.c:103 on this tree,
            # so the CLO fixup is a no-op. Kept because it is idempotent and
            # self-checking. Unrelated to the fuzz hunk, which is in
            # fs/proc/task_mmu.c.
            [ -f ".github/actions/fixup_susfs.sh" ] && bash .github/actions/fixup_susfs.sh .
            SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
            if [ -f "$SUSFS_PATCH" ]; then
              # -r dumps .rej into a directory we actually read, rather than
              # scattering them through the tree where nobody looks.
              rm -rf susfs_rej && mkdir susfs_rej
              set +e
              patch -p1 --forward -r "susfs_rej" < "$SUSFS_PATCH" > "susfs_rej/out" 2>&1
              PATCH_RC=$?
              set -e
              OFFSETS=$(grep -c 'offset' "susfs_rej/out" || true)
              FUZZ=$(grep -c 'with fuzz' "susfs_rej/out" || true)
              FAILED=$(grep -c 'FAILED' "susfs_rej/out" || true)
              REJS=$(find susfs_rej -name '*.rej' 2>/dev/null | wc -l)
              echo "  patch: exit=$PATCH_RC failed_hunks=$FAILED offsets=$OFFSETS fuzz=$FUZZ rejected_files=$REJS"
              if [ "$PATCH_RC" -ne 0 ] || [ "$FAILED" -gt 0 ] || [ "$REJS" -gt 0 ]; then
                echo "::error::SUSFS patch did not apply cleanly"
                cat "susfs_rej/out"
                find susfs_rej -name '*.rej' -exec cat {} \; 2>/dev/null
                exit 1
              fi
              # Location assertion. patch already reported success, so this
              # can only fail if the hooks landed elsewhere, in the wrong
              # order, or were removed afterwards. The checker is a script in
              # this repo rather than a heredoc, because a heredoc indented
              # for a 14-space YAML block scalar terminates the block.
              .github/actions/check-susfs-hooks.sh fs/proc/task_mmu.c
              # SUSFS ships the fully-patched sources alongside the patch; the
              # patch alone only adds glue/context.
              cp -v susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
              cp -v susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
              SUSFS_VER="v$(grep -m1 '#define SUSFS_VERSION' susfs4ksu/kernel_patches/include/linux/susfs.h | sed -E 's/.*"v?([^"]+)".*/\1/')"
              echo "  SUSFS version: $SUSFS_VER"
              echo "SUSFS_STATUS=applied ($(git -C susfs4ksu rev-parse --short HEAD), $SUSFS_VER, ${OFFSETS} offsets, ${FUZZ} fuzz)" >> $GITHUB_ENV
              echo "SUSFS_VERSION=$SUSFS_VER" >> $GITHUB_ENV
              rm -rf susfs_rej
            else
              echo "SUSFS_STATUS=patch-missing" >> $GITHUB_ENV
              echo "::error::$SUSFS_PATCH not found in the susfs4ksu clone; gate 3 will fail the build"
            fi
          else
            echo "SUSFS_STATUS=clone-failed" >> $GITHUB_ENV
            echo "::error::could not clone susfs4ksu; gate 3 will fail the build"
          fi

      - name: Apply Droidspaces kABI patch
        run: |
          # SYSVIPC kABI fix (Droidspaces): moves sysvsem/sysvshm into the
          # ANDROID_KABI_RESERVE(6/7/8) slots so enabling CONFIG_SYSVIPC does not
          # shift task_struct offsets -> no vendor-module bootloop.
          # This is the one patch that is NOT allowed to fail silently.
          #
          # Regenerated for 6.6.142; verified to apply with zero offset and zero
          # fuzz. This tree also has CONFIG_GKI_DYNAMIC_TASK_STRUCT_SIZE=y, but
          # that is orthogonal: it allocates the vendor area after
          # sizeof(task_struct), so it cannot shift fields inside the struct.
          echo "Applying Droidspaces SYSVIPC kABI patch..."
          patch -p1 --forward < .github/actions/droidspaces_sysvipc.patch
          echo "DROIDSPACES_STATUS=applied" >> $GITHUB_ENV

      - name: Configure kernel (official Kleaf-style synthesis)
        # The logic lives in .github/actions/configure-kernel.sh, not here.
        # GitHub expands a whole `run:` block as one expression and caps it at
        # 21000 characters; inline, this step was 22092 and the workflow was
        # rejected with "Exceeded max expression length 21000". The version
        # before that was 20803 -- 197 under the cap -- so it was going to
        # break again on the next edit regardless. As a script it has no size
        # limit and can be run locally, which is how it is tested.
        env:
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ENABLE_VENDOR_MODULES: ${{ inputs.enable_vendor_modules }}
          ENABLE_AUTOFDO: ${{ inputs.enable_autofdo }}
          ENABLE_THINLTO: ${{ inputs.enable_thinlto }}
          ENABLE_BTF: ${{ inputs.enable_btf }}
          REDUCE_DEBUG: ${{ inputs.reduce_debug }}
          REDUCE_DEBUG_GROUP: ${{ inputs.reduce_debug_group }}
        run: .github/actions/configure-kernel.sh
      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CCACHE_DIR="$PWD/.ccache"

          JOBS=$(nproc --all 2>/dev/null || echo 16)

          # PIPESTATUS[0] is make's real exit code. Without this, a pipeline
          # into tee always reports success -- and because arm64 builds Image
          # *after* modpost, a warm-cache re-run that has a stale Image in out/
          # would sail through the check below and claim SUCCESSFUL.
          set +e
          make -j"$JOBS" O=out CC="ccache clang" LLVM=1 LLVM_IAS=1 KCFLAGS="-w" 2>&1 | tee build.log
          MAKE_RC=${PIPESTATUS[0]}
          set -e
          echo "make exit code: $MAKE_RC"

          if [ "$MAKE_RC" -eq 0 ] && [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Build SUCCESSFUL"
            KREL=$(cat out/include/config/kernel.release 2>/dev/null || echo unknown)
            echo "KERNEL_RELEASE=$KREL" >> $GITHUB_ENV
            strings out/arch/arm64/boot/Image | grep 'Linux version' | head -1
            echo "MODULES_BUILT=$(find out -name '*.ko' | wc -l)" >> $GITHUB_ENV
            # .BTF is marked alloc,readonly by scripts/link-vmlinux.sh, so it
            # survives `objcopy -O binary` into Image. Assert it here rather
            # than trusting the config alone.
            if readelf -S out/vmlinux 2>/dev/null | grep -q '\.BTF'; then
              echo "BTF_SECTIONS_IN_VMLINUX=ok" >> $GITHUB_ENV
            else
              echo "::warning::no .BTF section in vmlinux despite CONFIG_DEBUG_INFO_BTF=y"
              echo "BTF_SECTIONS_IN_VMLINUX=missing" >> $GITHUB_ENV
            fi
          else
            echo "Build FAILED (make exit=$MAKE_RC)"
            # Surface the real cause instead of just the last 60 lines: modpost
            # symbol errors can be hundreds of lines above the make error tail.
            echo "--- errors ---"
            grep -nE "ERROR:|error:|undefined!|No rule to make|Stop\." build.log | head -30 || true
            echo "--- tail ---"
            tail -40 build.log
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          TEMP_DIR="anykernel_temp"
          rm -rf "$TEMP_DIR"
          cp -r anykernel "$TEMP_DIR"

          ZIMAGE_DIR="out/arch/arm64/boot"
          if [ -f "$ZIMAGE_DIR/Image.gz-dtb" ]; then
            cp -v "$ZIMAGE_DIR/Image.gz-dtb" "$TEMP_DIR/"
          elif [ -f "$ZIMAGE_DIR/Image.gz" ]; then
            cp -v "$ZIMAGE_DIR/Image.gz" "$TEMP_DIR/"
          elif [ -f "$ZIMAGE_DIR/Image" ]; then
            cp -v "$ZIMAGE_DIR/Image" "$TEMP_DIR/"
          fi
          # flash_boot looks for Image/Image.gz/Image.gz-dtb in the zip root
          # (ak3-core.sh:331-336) and, finding none, silently reflashes the
          # kernel it just dumped from the device -- the zip installs
          # "successfully" while changing nothing. The chain above has no else,
          # so a build that produced none of the three would ship exactly that
          # zip. Fail here instead, where the cause is still visible.
          STAGED_IMAGE=$(cd "$TEMP_DIR" && ls -1 Image Image.gz Image.gz-dtb 2>/dev/null | head -1)
          if [ -z "$STAGED_IMAGE" ]; then
            echo "::error::no kernel image staged in $TEMP_DIR -- build produced none of Image, Image.gz, Image.gz-dtb"
            ls -l "$ZIMAGE_DIR"/Image* 2>/dev/null || echo "(no Image* in $ZIMAGE_DIR at all)"
            exit 1
          fi
          echo "Staged kernel image: $STAGED_IMAGE ($(du -h "$TEMP_DIR/$STAGED_IMAGE" | cut -f1))"
          # A kernel that grows far past the stock one is a flashing risk on
          # its own -- the stock onyx Image is 36805120 bytes and boot
          # partitions are not elastic. Recording it makes a jump visible in
          # the run history instead of something to notice by eye at flash
          # time. Warning only: the threshold is a heuristic, not a rule.
          STAGED_BYTES=$(stat -c%s "$TEMP_DIR/$STAGED_IMAGE")
          echo "STAGED_IMAGE=$STAGED_IMAGE" >> $GITHUB_ENV
          echo "STAGED_BYTES=$STAGED_BYTES" >> $GITHUB_ENV
          if [ "$STAGED_BYTES" -gt 268435456 ]; then
            echo "::warning::staged image is $((STAGED_BYTES/1024/1024)) MB; stock onyx Image is 36.8 MB"
          fi

          if [ -d "$ZIMAGE_DIR/dts/vendor/qcom" ]; then
            mkdir -p "$TEMP_DIR/dtb"
            cp -v "$ZIMAGE_DIR"/dts/vendor/qcom/*.dtb "$TEMP_DIR/dtb/" 2>/dev/null || true
            cp -v "$ZIMAGE_DIR"/dts/vendor/qcom/*.dtbo "$TEMP_DIR/dtb/" 2>/dev/null || true
          fi
          # The branch above is currently inert on this tree as well: no dtsi
          # matches *onyx* or *sm8735* (arch/arm64/boot/dts/qcom holds 160
          # legacy dtsi), so the device takes its device tree from the vendor
          # side. Kept because it becomes live the moment a DTS-capable tree is
          # used, and dropping it would silently lose the dtb/ on that day.

          # Opt-in: hand the OEM modules to the zip. They are NOT flashed by
          # AnyKernel3 (that would need a vendor_dlkm repack) -- this is for
          # manual adb testing only.
          if [ "${{ inputs.bundle_modules }}" = "true" ]; then
            mkdir -p "$TEMP_DIR/modules"
            find out -name '*.ko' -exec cp --parents {} "$TEMP_DIR/modules/" \; 2>/dev/null || true
          fi

          VERSION="${{ inputs.version != '' && inputs.version || github.run_number }}"
          KREL="${{ env.KERNEL_RELEASE }}"
          KS="${{ env.KERNEL_CODENAME }} Kernel v${VERSION} (Linux ${KREL})"

          # Stamp the real version into the flash script so the on-device banner
          # can never go stale. META-INF/.../update-binary does
          #   KERNEL_STRING="$(file_getprop anykernel.sh kernel.string)"
          #   ui_print "$KERNEL_STRING"
          # so this one line is the whole banner -- there is no separate
          # ui_print line to patch.
          sed -i "s|^kernel.string=.*|kernel.string=${KS}|" "$TEMP_DIR/anykernel.sh"
          grep -E "^kernel.string=" "$TEMP_DIR/anykernel.sh" | sed 's/^/  /'

          ZIP_NAME="${{ env.KERNEL_CODENAME }}-Kernel-v${VERSION}-$(date +%Y%m%d).zip"
          cd "$TEMP_DIR"
          # Upstream's own packaging command (AnyKernel3 README, "Building"
          # step 5): zip -r9 UPDATE-AnyKernel3.zip * -x .git README.md *placeholder
          #
          #   *.md         upstream README.md plus our AK3-NOTES.md; both are
          #                developer documentation, nothing on-device needs them
          #   *placeholder only exist to keep empty dirs in git; the dirs
          #                themselves must stay (ak3-core.sh expects ramdisk/
          #                and patch/ to exist after extraction)
          #   LICENSE      deliberately KEPT -- upstream: "must remain in the
          #                final zip to comply with licenses for binary
          #                redistribution and the license of the AK3 scripts"
          #
          # Do NOT let the tools/ binaries be replaced from upstream AnyKernel3
          # master: it only ships 32-bit ARM, and SM8735 (Oryon) does not
          # execute AArch32. See anykernel/AK3-NOTES.md.
          zip -r9 "../$ZIP_NAME" ./* -x '*.md' '*placeholder'
          cd ..

          rm -rf "$TEMP_DIR"
          echo "ZIP_PATH=$PWD/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "Package: $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))"

      - name: Upload kernel package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.KERNEL_CODENAME }}-Kernel
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error

      - name: Build summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Build Complete

          | Item | Value |
          |------|-------|
          | **Kernel** | Linux ${{ env.KERNEL_RELEASE }} (Xiaomi SM8735 / onyx, branch `seventeen`) |
          | **Clang** | ${{ env.CLANG_VERSION }} (${{ env.CLANG_BRANCH }}, LLVM ${{ env.CLANG_MAJOR }}) — ${{ env.CLANG_STATUS }} |
          | **Config base** | `gki_defconfig` + `onyx_gki.fragment` (+ vendor =y, + susfs) |
          | **Config gates** | 3/3 passed (no overrides, no warnings, all fragments applied) |
          | **Reduction** | ${{ env.REDUCTION_STATUS }} |
          | **Reduction audit** | ${{ env.REDUCTION_AUDIT || 'not run (reduction off)' }} |
          | **Vendor modules** | ${{ inputs.enable_vendor_modules && 'onyx_perf.config =y entries merged' || 'skipped' }} |
          | **HZ** | 300 |
          | **LTO** | ${{ env.LTO_STATUS }} |
          | **ZRAM** | lz4 |
          | **Code gen** | ${{ env.CLANG_VERSION }} + ${{ env.LTO_STATUS }} + AutoFDO: ${{ inputs.enable_autofdo && 'on' || 'off' }} |
          | **Module sig** | SHA-256, not forced (stock `vendor_dlkm` still loads, kernel taints) |
          | **ReSukiSU** | ${{ env.KSU_STATUS }} |
          | **SUSFS** | ${{ env.SUSFS_STATUS || 'disabled' }} |
          | **Droidspaces** | ${{ env.DROIDSPACES_STATUS }} |
          | **BTF** | ${{ env.BTF_STATUS }} |
          | **AutoFDO** | ${{ env.AUTOFDO_STATUS }} |
          | **Modules built** | ${{ env.MODULES_BUILT }} |
          | **Kernel image** | ${{ env.STAGED_IMAGE }} ($(({{ env.STAGED_BYTES }}/1024/1024)) MB) |
          | **Artifact** | ${{ env.ZIP_NAME }} |

          Not ported yet: BBRv3, NTSYNC, Baseband-guard.
          EOF
